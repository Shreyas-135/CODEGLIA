services:
  - type: web
    name: codeglia
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_ENABLED
        value: false
      - key: LLM_BACKEND
        value: gemini
